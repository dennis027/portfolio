  <script>
    // Apply the saved theme before first paint, and flag JS so scroll reveals only hide content when they can run.
    (function () {
      var root = document.documentElement;
      root.classList.add('js');
      // Play the intro once per session — not under reduced motion, and not when arriving on a deep link or tour link
      try {
        if (!location.hash && !/[?&]tour/.test(location.search) && !sessionStorage.getItem('intro') && !matchMedia('(prefers-reduced-motion: reduce)').matches) {
          root.classList.add('intro-play');
          sessionStorage.setItem('intro', '1');
        }
      } catch (e) {}
      try {
        var t = localStorage.getItem('theme');
        if (t === 'light' || t === 'dark') root.setAttribute('data-theme', t);
      } catch (e) {}
    })();
  </script>
