<div class="flow" aria-hidden="true">
  @for (row of diagram().rows; track $index; let last = $last) {
    <div class="flow__row" [style.--cols]="row.length" [style.--r]="$index">
      @for (node of row; track node.label) {
        <div class="flow__node" [attr.data-tone]="node.tone">
          <span class="flow__label">{{ node.label }}</span>
          @if (node.detail) {
            <span class="flow__detail">{{ node.detail }}</span>
          }
        </div>
      }
    </div>
    @if (!last) {
      <div class="flow__link" [style.--i]="$index"><span class="flow__packet"></span></div>
    }
  }
</div>
@if (showCaption()) {
  <p class="flow__caption">{{ diagram().caption }}</p>
}
